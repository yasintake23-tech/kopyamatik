name: Android APK Oluştur

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Derleme Türü (debug veya release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: APK Derle & Yükle
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Wrapper İzinlerini Ayarla
        run: chmod +x gradlew

      - name: Debug APK Derle
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: ./gradlew assembleDebug --stacktrace

      - name: Release APK Derle (İsteğe Bağlı)
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: ./gradlew assembleRelease --stacktrace

      - name: APK Dosyasını Düzenle ve Hazırla
        run: |
          mkdir -p output_apk
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apk/kopyamatik-debug.apk
            echo "Debug APK kopyalandı."
          fi
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk output_apk/kopyamatik-release-unsigned.apk
            echo "Release APK kopyalandı."
          fi

      - name: APK Dosyasını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: kopyamatik-apk
          path: output_apk/*.apk
          retention-days: 14

      - name: GitHub Release Olarak Yayınla (Tag veya Manuel İse)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/*.apk
          name: "Sürüm ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
